assumptions:
  - id: DATA-001
    provenance: SYNTHETIC
    title: Building portfolio
    statement: "The 600 locations in exposure_nairobi_with_hazard.csv form a sample portfolio, not a Kenya Re or cedant book."
  - id: DATA-002
    provenance: REAL
    title: Named flood hotspots
    statement: "24 of Nairobi County's 37 mapped flood-prone neighbourhoods, geocoded. Used to validate the proxy and to site the deterministic drainage-gap rule."
  - id: DATA-003
    provenance: PROXY
    title: Hazard scores
    statement: "0–1 susceptibility from terrain elevation, depressions, slope and OSM rivers. Not measured flood depth or a calibrated hydrological model. The kit states the proxy flags 12 of 24 hotspots."
  - id: HAZ-001
    provenance: ASSUMPTION
    title: Proxy score to damage tier
    statement: "For each source hazard tier, a positive 0–1 proxy score activates the fixed construction-class damage ratio for that tier; a zero score gives zero modelled damage. The score is not converted to metres or interpolated into damage."
  - id: HAZ-002
    provenance: ASSUMPTION
    title: Return periods on the five tiers
    statement: "Scenario names follow common=10y, occasional=25y, moderate=50y, severe=100y, extreme=250y. The supplied files name footprints in the opposite order: extreme, severe, moderate, occasional, common respectively. These reversed source masks keep losses increasing with assumed event rarity; the files do not carry measured return periods."
  - id: VUL-001
    provenance: SOURCED
    title: JRC Africa residential table
    statement: "Huizinga, de Moel & Szewczyk (2017), Global flood depth-damage functions, EUR 28552 EN, Table 3-1, printed p. 12 (PDF p. 16): 0 m → 0%, 0.5 m → 22%, 1 m → 38%, 1.5 m → 53%, 2 m → 64%, 3 m → 82%, 4 m → 90%, 5 m → 96%, 6 m → 100%. https://publications.jrc.ec.europa.eu/repository/bitstream/JRC105688/global_flood_depth-damage_functions__10042017.pdf#page=16"
  - id: VUL-002
    provenance: ASSUMPTION
    title: Five-tier construction damage matrix
    statement: "Fixed percentages for informal, semi-permanent, masonry and RCC at common/occasional/moderate/severe/extreme scenario tiers are listed in model_parameters.yaml. They rise with this prototype's assumed event order and peak at 85%, 69%, 52% and 31% respectively. JRC Africa residential depth-damage values inform the shape, but these tier percentages are assumptions, not JRC class curves or calibrated Kenya claims estimates."
  - id: FIN-001
    provenance: METHOD
    title: Ground-up and insured loss
    statement: "Ground-up loss = damage_ratio × tiv_kes. Gross insured loss per property = min(max(ground-up loss − deductible, 0), policy limit); portfolio gross loss sums property payouts."
  - id: FIN-002
    provenance: ASSUMPTION
    title: Synthetic property policy terms
    statement: "Each run's deductible and policy limit are assumed percentages of each building's TIV, applied to every synthetic building. The starter exposure contains no verified policy terms. The default 0% deductible and 100% limit reproduce ground-up loss."
  - id: FIN-003
    provenance: ASSUMPTION
    title: Portfolio treaty waterfall
    statement: "For each scenario, quota-share recovery = aggregate gross insured loss × ceded percentage. Catastrophe XOL recovery = min(max(retained event loss − attachment, 0), layer limit). Net loss is retained event loss less cat recovery. The layer applies once to the aggregate scenario, not to each building. The terms are user-entered assumptions, with no reinstatements, annual aggregate limit, reinstatement premium, or treaty coverage verification."
  - id: HAZ-003
    provenance: ASSUMPTION
    title: Unvalidated drainage sensitivity
    statement: "Optional deterministic distance kernel around the 12 common-proxy-missed named hotspot centres. Disabled in the default run. The same centres define the uplift and cannot independently validate improved prediction. Its loss difference is an unvalidated sensitivity, not measured drainage or an accuracy gain."
  - id: AI-001
    provenance: CONDITIONAL
    title: Reviewed free-text exposure
    statement: "When the selected Gemini or OpenAI extraction is configured and its structured output is reviewed, model-extracted sample buildings change total exposure and loss. Without the selected service, strict rules can preview explicit values but are not AI."
