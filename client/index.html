<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#10294F">
  <meta name="description" content="Risk Atlas: flood risk intelligence for Nairobi. Explore mapped terrain and rivers, sample exposure and illustrative flood loss.">
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <link rel="alternate icon" type="image/x-icon" href="/assets/favicon.ico">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <title>Risk Atlas: flood risk intelligence for Nairobi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;800&display=block" rel="stylesheet">
  <style>
    :root {
      --u: min(calc(100vw / 1280), calc(100dvh / 760));
      --ink: #fff; --white-btn: #fdfdfd;
      --btn-ink: #050505; --glass-fill: rgba(0,0,0,.78); --glass-line: rgba(255,255,255,.09);
      --dx: 8.5; --dy: 13.1;
    }
    @supports not (height: 100dvh) { :root { --u: min(calc(100vw / 1280), calc(100vh / 760)); } }
    * { box-sizing: border-box; }
    /* The hero keeps its own 100dvh box; the page scrolls so the sections
       mounted below it are reachable. */
    html { height: 100%; }
    body { margin: 0; padding: 0; min-height: 100%; background: #000; }
    .landing-page { min-width: 0; }
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
      text-rendering: geometricPrecision; color: var(--ink);
    }
    .hero { position: relative; width: 100%; height: 100dvh; overflow: hidden; background: #000; }
    @supports not (height: 100dvh) { .hero { height: 100vh; } }
    .bg {
      position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%);
      width: max(100vw, calc(100dvh * 1.6)); height: max(62.5vw, 100dvh); background: #000;
    }
    @supports not (height: 100dvh) { .bg { width: max(100vw, calc(100vh * 1.6)); height: max(62.5vw, 100vh); } }
    .bg-video {
      position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 51% 8%;
      display: block; background: #000; pointer-events: none; opacity: 0; transition: opacity .9s linear;
    }
    .bg-video.is-active { opacity: 1; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; font-family: inherit;
      text-decoration: none; white-space: nowrap; border: 0; cursor: pointer;
    }
    .btn-primary:hover { background: #fff; }
    .arw { flex: 0 0 auto; display: block; width: calc(11.5 * var(--u)); height: calc(9.6 * var(--u)); }
    .hero-inner {
      position: absolute; left: 50%; top: 50%;
      transform: translate(-50%,-50%) translate(calc(var(--dx) * var(--u)), calc(var(--dy) * var(--u)));
      width: max-content; text-align: center; z-index: 2;
    }
    h1 {
      margin: 0; font-weight: 500; font-size: calc(89 * var(--u));
      line-height: calc(90 * var(--u)); letter-spacing: calc(-1 * var(--u)); color: var(--ink);
    }
    .ln, .ln-i { display: block; }
    .sub {
      margin: calc(16.1 * var(--u)) 0 0; font-weight: 300; font-size: calc(17.4 * var(--u));
      line-height: calc(27 * var(--u)); letter-spacing: calc(-.30 * var(--u)); color: #f6f6f6;
    }
    .ctas {
      margin-top: calc(21.8 * var(--u)); display: flex; align-items: center;
      justify-content: center; transform: translateX(calc(-.75 * var(--u))); gap: calc(7 * var(--u));
    }
    .btn-lg {
      height: calc(39 * var(--u)); border-radius: calc(19.5 * var(--u)); font-size: calc(13.3 * var(--u));
      font-weight: 500; letter-spacing: calc(-.3 * var(--u)); gap: calc(9 * var(--u));
    }
    .btn-primary {
      background: var(--white-btn); color: var(--btn-ink); padding-left: calc(18.2 * var(--u));
      padding-right: calc(19.2 * var(--u)); transition: background .18s ease, transform .18s ease;
    }
    .btn-ghost {
      background: var(--glass-fill); color: #d9d9d9; padding: 0 calc(17.4 * var(--u));
      border: 1px solid var(--glass-line); -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px);
      transition: background .18s ease, border-color .18s ease;
    }
    .btn-ghost:hover { background: rgba(0,0,0,.66); border-color: rgba(255,255,255,.16); }
    .btn-lg .arw { width: calc(13 * var(--u)); height: calc(10.8 * var(--u)); }
    a:focus-visible, button:focus-visible { outline: 2px solid #a78bfa; outline-offset: 3px; border-radius: 99px; }
    @media (max-width: 1160px) {
      :root { --u: min(max(.9px, min(calc(100vw / 1280), calc(100dvh / 760))), calc((100vw - 72px) / 575), calc(100dvh / 620)); }
      .hero-inner { max-width: calc(100vw - 48px); }
      .sub { font-size: max(16px, calc(17.4 * var(--u))); line-height: max(25px, calc(27 * var(--u))); }
      .ctas { margin-top: max(26px, calc(21.8 * var(--u))); gap: max(10px, calc(7 * var(--u))); }
      .btn-lg { height: max(44px, calc(39 * var(--u))); border-radius: max(22px, calc(19.5 * var(--u))); font-size: max(15px, calc(13.3 * var(--u))); gap: max(10px, calc(9 * var(--u))); }
      .btn-primary { padding-left: max(21px, calc(18.2 * var(--u))); padding-right: max(22px, calc(19.2 * var(--u))); }
      .btn-ghost { padding-left: max(20px, calc(17.4 * var(--u))); padding-right: max(21px, calc(18.4 * var(--u))); }
      .btn-lg .arw { width: max(14px, calc(13 * var(--u))); height: max(11.6px, calc(10.8 * var(--u))); }
    }
    @media (max-width: 552px) {
      :root { --u: 1px; }
      .hero-inner { position: absolute; left: 0; right: 0; top: 50%; width: auto; max-width: none; padding: 0 20px; transform: translateY(-47%); }
      h1 { font-size: min(74px, calc((100vw - 44px) / 7.7)); line-height: 1.04; letter-spacing: -.02em; }
      .sub { margin-top: 16px; font-size: clamp(15.5px, 4vw, 16.5px); line-height: 1.6; letter-spacing: 0; max-width: 42ch; margin-left: auto; margin-right: auto; }
      .sub br { display: none; }
      .ctas { margin-top: 24px; gap: 10px; transform: none; flex-wrap: wrap; }
      .btn-lg { height: 46px; border-radius: 23px; font-size: 15px; gap: 9px; }
      .btn-primary { padding-left: 20px; padding-right: 21px; }
      .btn-ghost { padding-left: 19px; padding-right: 20px; }
      .btn-lg .arw { width: 13px; height: 11px; }
    }
    @media (max-width: 353px) { .ctas { flex-direction: column; align-items: center; } .btn-lg { width: min(100%, 272px); } }
    @media (max-width: 552px) and (max-height: 460px) {
      h1 { font-size: min(44px, calc((100vw - 44px) / 7.7)); }
      .sub { margin-top: 12px; font-size: 15px; line-height: 1.5; }
      .ctas { margin-top: 18px; }
      .hero-inner { transform: translateY(-44%); }
    }
  </style>
  <script>
    if (['/dashboard', '/login', '/register', '/app'].includes(location.pathname)) {
      location.replace(location.pathname + '/');
    }
  </script>
</head>
<body class="landing-page">
  <div id="landing-header" class="sticky top-0 z-50 -mb-px h-px"></div>
  <main>
  <section class="hero" aria-label="Risk Atlas flood model">
    <div class="bg" role="img" aria-label="Stylised globe of Earth rendered as a purple dot matrix against a starfield, slowly rotating">
      <video class="bg-video is-active" id="bgVideoA" autoplay muted loop playsinline preload="auto" disablepictureinpicture aria-hidden="true" poster="https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/82e7eb75-c65f-490a-99b5-f3d1cad54200.webp"><source src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260912_104036_bd6924f6-3c8e-417e-8465-6d03c8c2e9e6.mp4" type="video/mp4"></video>
      <video class="bg-video" id="bgVideoB" muted loop playsinline preload="auto" disablepictureinpicture aria-hidden="true" poster="https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/82e7eb75-c65f-490a-99b5-f3d1cad54200.webp"><source src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260912_104036_bd6924f6-3c8e-417e-8465-6d03c8c2e9e6.mp4" type="video/mp4"></video>
    </div>
    <div class="hero-inner" id="hero-content"></div>
  </section>
  <div id="landing-sections"></div>
  </main>
  <div id="landing-footer"></div>
  <script type="module" src="/src/landing-main.tsx"></script>
  <script>
    (() => {
      const a = document.getElementById('bgVideoA');
      const b = document.getElementById('bgVideoB');
      if (!a || !b) return;
      if (matchMedia('(prefers-reduced-motion: reduce)').matches) {
        a.removeAttribute('autoplay'); a.pause(); b.pause();
        try { a.currentTime = 0; } catch { /* The poster remains visible. */ }
        return;
      }
      const FADE = .9;
      let cur = a, nxt = b, swapping = false;
      const play = (video) => { const promise = video.play(); if (promise && promise.catch) promise.catch(() => {}); };
      play(a);
      const tick = () => {
        if (swapping || !cur.duration || cur.duration - cur.currentTime > FADE) return;
        swapping = true;
        const out = cur;
        nxt.currentTime = 0; play(nxt);
        nxt.classList.add('is-active'); out.classList.remove('is-active');
        [cur, nxt] = [nxt, out];
        setTimeout(() => { out.pause(); out.currentTime = 0; swapping = false; }, FADE * 1000 + 100);
      };
      a.addEventListener('timeupdate', tick);
      b.addEventListener('timeupdate', tick);
    })();
  </script>
</body>
</html>
